name: Build custom_parabricks-metrics

on:
  push:
    branches:
      - main
    paths:
      - 'basej-wgs/container/custom_parabricks-metrics/**'
      - '.github/workflows/build-custom-parabricks-metrics.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./basej-wgs/container/custom_parabricks-metrics
          file: ./basej-wgs/container/custom_parabricks-metrics/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/alfonsobravopaneque/basejumper_custom_parabricks-metrics:1.0.3
            ghcr.io/alfonsobravopaneque/basejumper_custom_parabricks-metrics:latest
