name: Build and Push All Containers to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push All Containers
        run: |
          # Convertir usuario a minúsculas (requisito de GHCR)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="basej-dnaqc/container"

          BUILDS=(
            "ubuntu:basejumper_ubuntu_24.04_stable"
            "seqkit:basejumper_seqkit-2.13.0"
            "samtools:basejumper_samtools-1.23.1"
            "bwamem2_samtools:basejumper_bwamem2_samtools_2.2.1"
            "picard_addorreplacegroups:basejumper_picard_addorreplacegroups_3.1.2"
            "ginkgo:basejumper_ginkgo_0.3.1"
            "preseq_bam2mr:basejumper_preseq_bam2mr_0.1"
            "ginko_parser:basejumper_ginko_parser_0.2.1"
            "custom_parabricks-metrics:basejumper_custom_parabricks-metrics_1.0.3"
            "custom_r_qcplots:basejumper_custom_r_qcplots_0.3.0"
          )

          for entry in "${BUILDS[@]}"; do
            folder="${entry%%:*}"
            tag="${entry##*:}"
            ghcr_tag="ghcr.io/${OWNER}/${tag}:latest"

            echo "==> Compilando $folder como $ghcr_tag"
            docker build -t "$ghcr_tag" "$BASE/$folder"

            echo "==> Subiendo $ghcr_tag a GHCR"
            docker push "$ghcr_tag"
          done
