name: Build Containers

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        run: |
          cd basej-dnaqc/container
          bash build_all_x86.sh

          USER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          for img in $(docker images --format "{{.Repository}}" | grep basejumper); do
            docker tag "$img" "ghcr.io/$USER/$img:latest"
            docker push "ghcr.io/$USER/$img:latest"
          done
