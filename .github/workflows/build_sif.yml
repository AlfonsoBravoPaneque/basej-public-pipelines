name: Build SIF for BaseJ

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and Build Docker Image
        run: |
          echo "=== Listando estructura de basej-dnaqc ==="
          find basej-dnaqc -maxdepth 3

          # Buscar cualquier Dockerfile en el repositorio
          TARGET_DOCKERFILE=$(find . -iname "*dockerfile*" | head -n 1)

          if [ -z "$TARGET_DOCKERFILE" ]; then
            echo "ERROR: No se encontro ningun archivo Dockerfile en el repositorio."
            exit 1
          fi

          echo "Usando Dockerfile encontrado en: $TARGET_DOCKERFILE"
          CONTEXT_DIR=$(dirname "$TARGET_DOCKERFILE")

          docker build -t basej-custom:latest -f "$TARGET_DOCKERFILE" "$CONTEXT_DIR"
          docker save basej-custom:latest -o basej-custom.tar

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2

      - name: Convert to SIF
        run: |
          apptainer build basej-custom.sif docker-archive://basej-custom.tar

      - name: Upload SIF
        uses: actions/upload-artifact@v4
        with:
          name: basej-dnaqc-custom-sif
          path: basej-custom.sif
