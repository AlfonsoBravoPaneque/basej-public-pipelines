name: Build Single Container

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Parabricks Metrics
        run: |
          USER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          TAG="basejumper_custom_parabricks-metrics_1.0.3"
          GHCR_TAG="ghcr.io/$USER/$TAG:latest"

          docker build -t "$GHCR_TAG" basej-dnaqc/container/custom_parabricks-metrics
          docker push "$GHCR_TAG"
